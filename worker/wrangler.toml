# Cloudflare Worker: Railway webhook -> GitHub workflow_dispatch (verify.yml).
# Secrets are never stored here; set them with:
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN
# For `wrangler dev`, put them in worker/.dev.vars (git-ignored).
name = "szczur-radar-monitor"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Public values, not secrets: the szczur-radar Railway project and this repository.
RAILWAY_PROJECT_ID = "decf00e4-f5a4-43df-b338-6698be87c5a1"
GITHUB_REPO = "kwmacioszek/szczur-radar-monitor"
